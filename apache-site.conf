<Directory /var/www/html>
    Options -Indexes -MultiViews
    RewriteEngine On
# Retired transaction endpoints must never execute or expose their source.
RewriteRule ^/?(?:store|licenses)(?:/|$) /archive.php [END]
RewriteRule ^/?(?:info\.php|versions/index(?:\.php)?|press/thanks(?:\.php)?)$ /archive.php [END]
# This incomplete copy has no catalog; use the maintained photo site.
RewriteRule ^/?kavafoto(?:/(.*))?$ https://kavafoto.com/$1 [R=302,L]
RewriteRule ^/?iConquer/imageflow/reflect[23](?:\.php)?$ /archive.php [END]
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}.php -f
    RewriteRule ^(.+)$ $1.php [END]
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "(?:^|/)\.(?:git|agents|codex)(?:/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(?:Dockerfile|README\.md|apache-site\.conf|fly\.toml)$">
    Require all denied
</FilesMatch>
<Directory /var/www/html/licenses>
    Require all denied
</Directory>
# Localization fragments are data, not standalone pages.
<Directory /var/www/html/Shoebox/download/en>
    Require all denied
</Directory>
